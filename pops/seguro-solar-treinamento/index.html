<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguro Solar - Treinamento Pós-Vendas | Ello Solar</title>
<style>
  :root {
    --bg: #141414;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide-wrap {
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .slide-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    user-select: none;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 18px;
  }
  .controls button {
    background: #f5a623;
    color: #141414;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .controls button:disabled {
    background: #555;
    color: #999;
    cursor: default;
  }
  .counter {
    color: #eee;
    font-size: 14px;
    min-width: 60px;
    text-align: center;
  }
  .hint {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <div class="slide-wrap">
    <img id="slideImg" src="slides/slide-01.jpg" alt="Slide 1">
  </div>

  <div class="controls">
    <button id="prevBtn" onclick="changeSlide(-1)">&larr; Anterior</button>
    <div class="counter"><span id="current">1</span> / <span id="total">18</span></div>
    <button id="nextBtn" onclick="changeSlide(1)">Próximo &rarr;</button>
  </div>
  <div class="hint">Use as setas do teclado para navegar</div>

<script>
  const total = 18;
  let current = 1;

  function pad(n) { return n < 10 ? "0" + n : n; }

  function render() {
    document.getElementById("slideImg").src = "slides/slide-" + pad(current) + ".jpg";
    document.getElementById("slideImg").alt = "Slide " + current;
    document.getElementById("current").textContent = current;
    document.getElementById("prevBtn").disabled = current === 1;
    document.getElementById("nextBtn").disabled = current === total;
  }

  function changeSlide(delta) {
    const next = current + delta;
    if (next >= 1 && next <= total) {
      current = next;
      render();
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") changeSlide(1);
    if (e.key === "ArrowLeft") changeSlide(-1);
  });

  render();
</script>

</body>
</html>
