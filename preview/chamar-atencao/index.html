<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia · Chamar atenção</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:radial-gradient(700px 500px at 85% 0%,rgba(255,138,30,.35),transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(122,60,255,.4),transparent 60%),#0b0610;overflow:hidden}
h1{margin:18px 24px 4px;font-size:20px}p.sub{margin:0 24px 14px;opacity:.7;font-size:13px}
#janela{width:min(760px,94vw);margin:0 auto;border:1px solid rgba(255,140,60,.5);border-radius:16px;background:rgba(10,6,12,.85);box-shadow:0 0 40px rgba(255,90,20,.25);overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.15);font-weight:800}
.top .on{width:10px;height:10px;border-radius:50%;background:#3ddc84}
.msgs{height:300px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px}.m.eu{align-self:flex-end;background:rgba(120,30,10,.8)}
.sys{align-self:center;font-size:12px;opacity:.85;background:rgba(255,200,60,.14);border:1px solid rgba(255,200,60,.35);padding:4px 12px;border-radius:99px;animation:pop .3s}
.bar{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.15);flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(6,6,6,.65);color:#fff;padding:9px 14px;font-weight:700}
button.at{background:linear-gradient(180deg,#ff9a2e,#d9570a);border-color:#ffb066}
input[type=text]{flex:1;min-width:140px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;padding:9px 12px;font:inherit}
.opts{margin:16px auto;width:min(760px,94vw);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
select{background:#111;color:#fff;border:1px solid #fff5;border-radius:8px;padding:6px}
.nudge{animation:tremer .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes tremer{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(6px,-3px)}30%,50%,70%{transform:translate(-10px,4px)}40%,60%{transform:translate(10px,-4px)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:.85}}
#toast{position:fixed;right:18px;bottom:-140px;width:290px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#2a1a10,#150c08);border:1px solid #ff9a4a;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:bottom .45s cubic-bezier(.2,1.2,.3,1);font-size:13px;z-index:10}
#toast.on{bottom:18px}#toast b{display:block;margin-bottom:2px;color:#ffb066}
.flash{position:fixed;inset:0;pointer-events:none;background:#ff9a2e;opacity:0}.flash.on{animation:fl .6s}@keyframes fl{0%{opacity:.35}100%{opacity:0}}
</style></head><body>
<h1>💬 Prévia · Chamar atenção</h1><p class="sub">Clique em "Chamar atenção" para ver a tela tremer e ouvir o som. Nada foi publicado no site do time.</p>
<div id="janela">
  <div class="top"><span class="on"></span> Kuka <small style="font-weight:400;opacity:.65">online agora</small></div>
  <div class="msgs" id="msgs"><div class="m">Oi Ana, tudo bem?</div><div class="m eu">Tudo! Preciso falar com você 😄</div></div>
  <div class="bar"><input type="text" id="txt" placeholder="Escreva uma mensagem…"><button onclick="enviar()">Enviar</button><button class="at" onclick="chamar()">🔔 Chamar atenção</button></div>
</div>
<div class="opts"><label>Som do chamado: <select id="som"><option value="vibra">Vibração (estilo MSN)</option><option value="plim">Plim</option><option value="gorgulho">Gorgulho (bolhinha)</option></select></label>
<button onclick="notif()">📩 Ver aviso de nova mensagem (canto da tela)</button><label><input type="checkbox" id="mudo"> sem som</label></div>
<div id="toast"><b>Kuka</b>Ana está chamando sua atenção! 🔔</div><div class="flash" id="fl"></div>
<script>
var ctx;function ac(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function tom(f,t0,d,tipo,vol,f2){var c=ac(),o=c.createOscillator(),g=c.createGain();o.type=tipo||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.25,c.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.02)}
function som(tipo){if(document.getElementById('mudo').checked)return;
 if(tipo==='vibra'){for(var i=0;i<9;i++)tom(i%2?180:240,i*.06,.07,'sawtooth',.18)}
 else if(tipo==='plim'){tom(880,0,.35,'sine',.3);tom(1320,.12,.5,'sine',.25)}
 else{tom(300,0,.12,'sine',.3,900);tom(500,.1,.12,'sine',.3,1200);tom(400,.22,.16,'sine',.3,1500)}}
function sys(t){var m=document.getElementById('msgs'),d=document.createElement('div');d.className='sys';d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
function chamar(){var j=document.getElementById('janela');j.classList.remove('nudge');void j.offsetWidth;j.classList.add('nudge');
 var f=document.getElementById('fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');som(document.getElementById('som').value);sys('🔔 Você chamou a atenção do Kuka!');
 setTimeout(function(){sys('🔔 Kuka chamou a sua atenção!');j.classList.remove('nudge');void j.offsetWidth;j.classList.add('nudge');som(document.getElementById('som').value)},2200)}
function notif(){var t=document.getElementById('toast');t.classList.add('on');som('plim');setTimeout(function(){t.classList.remove('on')},3500)}
function enviar(){var i=document.getElementById('txt');if(!i.value.trim())return;var d=document.createElement('div');d.className='m eu';d.textContent=i.value;document.getElementById('msgs').appendChild(d);i.value=''}
</script></body></html>
